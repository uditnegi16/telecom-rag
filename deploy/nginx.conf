server {
    listen 80;
    server_name _;
    client_max_body_size 30M;      # upload limit; app enforces 25MB

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Built SPA assets. Hashed filenames, so cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxied to the backend container. Same-origin, so no CORS and the
    # frontend never needs a baked-in backend hostname.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generation plus per-claim verification can exceed the default 60s
        # under free-tier rate limiting.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
